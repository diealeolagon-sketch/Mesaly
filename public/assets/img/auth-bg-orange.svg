<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <!-- Fondo Radiante Cálido Mesaly -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="30%" stop-color="#FF6A00"/>
      <stop offset="70%" stop-color="#E84E00"/>
      <stop offset="100%" stop-color="#C53200"/>
    </linearGradient>

    <!-- Resplandor Ámbar Cenital -->
    <radialGradient id="sunGlow" cx="22%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FF7A00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF5100" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombras Atmosféricas -->
    <linearGradient id="horizonFog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"/>
      <stop offset="60%" stop-color="#E84E00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A52600" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Degradados Pedestal 1: Terracota Vino Gourmet -->
    <linearGradient id="pWineTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B84260"/>
      <stop offset="100%" stop-color="#8F2542"/>
    </linearGradient>
    <linearGradient id="pWineLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B1A33"/>
      <stop offset="100%" stop-color="#4F0A1C"/>
    </linearGradient>
    <linearGradient id="pWineRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C1123"/>
      <stop offset="100%" stop-color="#350410"/>
    </linearGradient>

    <!-- Degradados Pedestal 2: Cobre & Fuego Asador -->
    <linearGradient id="pFireTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D95C2B"/>
      <stop offset="100%" stop-color="#B33E10"/>
    </linearGradient>
    <linearGradient id="pFireLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C320A"/>
      <stop offset="100%" stop-color="#691B02"/>
    </linearGradient>
    <linearGradient id="pFireRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A2204"/>
      <stop offset="100%" stop-color="#4E1200"/>
    </linearGradient>

    <!-- Degradados Pedestal 3: Madera Roble / Tabla Chef -->
    <linearGradient id="pWoodTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E87A38"/>
      <stop offset="100%" stop-color="#C25A1B"/>
    </linearGradient>
    <linearGradient id="pWoodLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5450E"/>
      <stop offset="100%" stop-color="#702A04"/>
    </linearGradient>
    <linearGradient id="pWoodRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#843306"/>
      <stop offset="100%" stop-color="#551D01"/>
    </linearGradient>

    <!-- Campana Cloche Dorada -->
    <linearGradient id="clocheGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#FFC837"/>
      <stop offset="100%" stop-color="#DD8808"/>
    </linearGradient>

    <!-- Botella de Vino Gourmet -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="40%" stop-color="#80182A"/>
      <stop offset="70%" stop-color="#5A101D"/>
      <stop offset="100%" stop-color="#30070D"/>
    </linearGradient>

    <!-- Desenfoque de Profundidad -->
    <filter id="bgSoftBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Lienzo Base Radiante -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  <rect width="1600" height="1000" fill="url(#sunGlow)"/>

  <!-- Patrón de Motivos Gastronómicos Sutiles de Fondo -->
  <g opacity="0.08" fill="#FFFFFF">
    <!-- Tenedor y Cuchillo flotantes -->
    <g transform="translate(180, 80) scale(1.6)">
      <path d="M 0 0 L 0 20 C 0 28, 6 30, 8 32 L 8 80 L 12 80 L 12 32 C 14 30, 20 28, 20 20 L 20 0 L 16 0 L 16 16 L 12 16 L 12 0 L 8 0 L 8 16 L 4 16 L 4 0 Z"/>
    </g>
    <g transform="translate(420, 100) scale(1.4)">
      <path d="M 0 0 C 14 6, 16 28, 16 45 L 8 45 L 8 80 L 4 80 L 4 45 L 0 45 Z"/>
    </g>
    <!-- Campana Gourmet -->
    <g transform="translate(680, 120) scale(1.5)">
      <path d="M 20 10 A 25 25 0 0 0 -20 10 L -25 12 L 25 12 Z M -3 0 A 3 3 0 1 1 3 0"/>
    </g>
    <!-- Copa de Vino -->
    <g transform="translate(940, 90) scale(1.5)">
      <path d="M -10 -15 C -10 5, 10 5, 10 -15 Z M -1 5 L -1 20 L -6 20 L 6 20 L 1 20 L 1 5"/>
    </g>
    <!-- Tenedor Mesaly -->
    <g transform="translate(1120, 110) scale(1.4)">
      <path d="M 0 0 L 0 16 C 0 24, 6 26, 8 28 L 8 70 L 12 70 L 12 28 C 14 26, 20 24, 20 16 L 20 0 L 16 0 L 16 12 L 12 12 L 12 0 L 8 0 L 8 12 L 4 12 L 4 0 Z"/>
    </g>
  </g>

  <!-- ========================================================
       BLOQUE ISOMÉTRICO 1 (Fondo Lejano con Desenfoque)
       ======================================================== -->
  <g opacity="0.4" filter="url(#bgSoftBlur)">
    <!-- Pedestal Alto Izquierdo (Mesa de Salón Bar) -->
    <path d="M 100 240 L 210 180 L 320 240 L 210 300 Z" fill="url(#pWineTop)"/>
    <path d="M 100 240 L 210 300 L 210 920 L 100 920 Z" fill="url(#pWineLeft)"/>
    <path d="M 210 300 L 320 240 L 320 920 L 210 920 Z" fill="url(#pWineRight)"/>

    <!-- Pedestal de Fondo Centro (Comandero) -->
    <path d="M 640 330 L 750 270 L 860 330 L 750 390 Z" fill="url(#pWoodTop)"/>
    <path d="M 640 330 L 750 390 L 750 920 L 640 920 Z" fill="url(#pWoodLeft)"/>
    <path d="M 750 390 L 860 330 L 860 920 L 750 920 Z" fill="url(#pWoodRight)"/>
  </g>

  <!-- ========================================================
       BLOQUE ISOMÉTRICO 2 (Pedestales Principales y Elementos de Cocina)
       ======================================================== -->
  <g opacity="0.75">
    <!-- ═══ PEDESTAL 1 (Izquierda Media): Estación de Cava & Vinos ═══ -->
    <g>
      <!-- Tapa Isométrica -->
      <path d="M 160 300 L 270 240 L 380 300 L 270 360 Z" fill="url(#pWineTop)"/>
      <!-- Cara Izquierda -->
      <path d="M 160 300 L 270 360 L 270 1000 L 160 1000 Z" fill="url(#pWineLeft)"/>
      <!-- Cara Derecha -->
      <path d="M 270 360 L 380 300 L 380 1000 L 270 1000 Z" fill="url(#pWineRight)"/>

      <!-- ELEMENTO GASTRONÓMICO SOBRE EL PEDESTAL: Botella de Vino & Copa Isométrica -->
      <g transform="translate(250, 160)">
        <!-- Sombra en la base -->
        <ellipse cx="20" cy="85" rx="28" ry="10" fill="rgba(40, 5, 12, 0.45)"/>
        <!-- Botella -->
        <rect x="8" y="24" width="24" height="60" rx="6" fill="url(#bottleGrad)"/>
        <rect x="15" y="0" width="10" height="24" rx="2" fill="#240409"/>
        <rect x="14" y="2" width="12" height="6" rx="1" fill="#FFB703"/> <!-- Sello dorado -->
        <rect x="10" y="42" width="20" height="24" rx="2" fill="#FFF7ED" opacity="0.9"/> <!-- Etiqueta -->
        <line x1="13" y1="48" x2="27" y2="48" stroke="#E85D04" stroke-width="1.5"/>
        <line x1="13" y1="53" x2="25" y2="53" stroke="#9A3412" stroke-width="1"/>

        <!-- Copa de Vino al lado -->
        <path d="M 40 50 C 40 70, 56 70, 56 50 Z" fill="rgba(255, 255, 255, 0.4)" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5"/>
        <path d="M 42 56 C 42 66, 54 66, 54 56 Z" fill="#9F1239" opacity="0.75"/> <!-- Vino tinto -->
        <line x1="48" y1="70" x2="48" y2="84" stroke="rgba(255, 255, 255, 0.7)" stroke-width="2"/>
        <ellipse cx="48" cy="84" rx="8" ry="3" fill="rgba(255, 255, 255, 0.5)"/>
      </g>
    </g>

    <!-- ═══ PEDESTAL 2 (Centro-Izquierda): Estación Principal de Chef & Asador ═══ -->
    <g>
      <!-- Tapa Isométrica Superior -->
      <path d="M 330 260 L 450 190 L 570 260 L 450 330 Z" fill="url(#pFireTop)"/>
      <!-- Cara Izquierda -->
      <path d="M 330 260 L 450 330 L 450 1000 L 330 1000 Z" fill="url(#pFireLeft)"/>
      <!-- Cara Derecha -->
      <path d="M 450 330 L 570 260 L 570 1000 L 450 1000 Z" fill="url(#pFireRight)"/>

      <!-- ELEMENTO GASTRONÓMICO: Campana Cloche Dorada Gourmet en Pedestal -->
      <g transform="translate(405, 125)">
        <!-- Sombra base -->
        <ellipse cx="45" cy="72" rx="42" ry="12" fill="rgba(30, 8, 2, 0.5)"/>
        <!-- Bandeja de Servicio -->
        <path d="M 0 68 C 0 76, 90 76, 90 68 C 90 60, 0 60, 0 68 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
        <path d="M 6 67 C 6 73, 84 73, 84 67 C 84 61, 6 61, 6 67 Z" fill="#FFFFFF"/>
        <!-- Domo Campana Cloche -->
        <path d="M 12 65 C 12 25, 78 25, 78 65 Z" fill="url(#clocheGold)"/>
        <!-- Reflejo blanco curvo -->
        <path d="M 22 55 C 22 34, 45 30, 48 30 C 42 34, 32 45, 30 55 Z" fill="#FFFFFF" opacity="0.6"/>
        <!-- Pomo de la Campana -->
        <ellipse cx="45" cy="22" rx="6" ry="6" fill="#FFF7ED"/>
        <ellipse cx="45" cy="21" rx="4" ry="4" fill="#FFB703"/>
      </g>
    </g>

    <!-- ═══ PEDESTAL 3 (Primer Plano Frontal): Tabla de Preparación & Cubiertos ═══ -->
    <g>
      <!-- Tapa Isométrica Frontal -->
      <path d="M 200 500 L 320 430 L 440 500 L 320 570 Z" fill="url(#pWoodTop)"/>
      <!-- Cara Izquierda -->
      <path d="M 200 500 L 320 570 L 320 1000 L 200 1000 Z" fill="url(#pWoodLeft)"/>
      <!-- Cara Derecha -->
      <path d="M 320 570 L 440 500 L 440 1000 L 320 1000 Z" fill="url(#pWoodRight)"/>

      <!-- ELEMENTO GASTRONÓMICO: Tenedor y Cuchillo Chef Esculpidos -->
      <g transform="translate(280, 410)">
        <!-- Sombra base -->
        <ellipse cx="40" cy="50" rx="36" ry="10" fill="rgba(30, 8, 2, 0.4)"/>
        <!-- Plato Isométrico -->
        <ellipse cx="40" cy="46" rx="32" ry="12" fill="#FFFFFF"/>
        <ellipse cx="40" cy="46" rx="24" ry="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Tenedor Gourmet Dorado sobre el plato -->
        <path d="M 24 38 L 24 44 C 24 48, 30 50, 31 52 L 31 66 L 33 66 L 33 52 C 34 50, 40 48, 40 44 L 40 38 L 38 38 L 38 42 L 35 42 L 35 38 L 33 38 L 33 42 L 30 42 L 30 38 Z" fill="#E85D04"/>
        <!-- Cuchillo Gourmet -->
        <path d="M 46 36 C 52 40, 52 50, 52 56 L 48 56 L 48 66 L 46 66 L 46 36 Z" fill="#FFB703"/>
      </g>
    </g>

    <!-- ═══ PEDESTAL 4 (Derecha de Apoyo): Estación de Comanda Digital ═══ -->
    <g>
      <path d="M 430 500 L 540 440 L 650 500 L 540 560 Z" fill="url(#pFireTop)"/>
      <path d="M 430 500 L 540 560 L 540 1000 L 430 1000 Z" fill="url(#pFireLeft)"/>
      <path d="M 540 560 L 650 500 L 650 1000 L 540 1000 Z" fill="url(#pFireRight)"/>

      <!-- ELEMENTO: Tablet / Pantalla Táctil con Comanda Mesaly -->
      <g transform="translate(500, 415)">
        <ellipse cx="36" cy="46" rx="28" ry="8" fill="rgba(30, 8, 2, 0.35)"/>
        <!-- Base soporte -->
        <polygon points="30,34 42,34 46,46 26,46" fill="#334155"/>
        <!-- Pantalla Tablet inclinada -->
        <polygon points="12,12 60,8 58,34 10,38" fill="#0F172A"/>
        <polygon points="14,14 58,10 56,32 12,36" fill="#FFFFFF"/>
        <!-- Líneas simulando interfaz de pedidos con color naranja Mesaly -->
        <line x1="18" y1="18" x2="34" y2="17" stroke="#E85D04" stroke-width="2"/>
        <line x1="18" y1="23" x2="48" y2="20" stroke="#94A3B8" stroke-width="1.5"/>
        <line x1="18" y1="28" x2="40" y2="25" stroke="#94A3B8" stroke-width="1.5"/>
        <circle cx="50" cy="17" r="2.5" fill="#10B981"/> <!-- Punto verde orden activa -->
      </g>
    </g>
  </g>

  <!-- Niebla Cálida Inferior para fundir la base orgánicamente -->
  <rect y="440" width="1600" height="560" fill="url(#horizonFog)"/>

  <!-- Tenedor Emblemático Flotante Sutil en la Esquina Superior Derecha -->
  <g transform="translate(1320, 140) rotate(15)" opacity="0.18">
    <ellipse cx="60" cy="140" rx="55" ry="16" fill="rgba(0,0,0,0.12)"/>
    <path d="M 30 0 L 30 40 C 30 60, 50 66, 54 72 L 54 180 C 54 188, 66 188, 66 180 L 66 72 C 70 66, 90 60, 90 40 L 90 0 L 78 0 L 78 30 L 68 30 L 68 0 L 52 0 L 52 30 L 42 30 L 42 0 Z" fill="#FFFFFF"/>
  </g>
</svg>
